services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowdesk
    ports:
      - '3001:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SECRET: ${SECRET}
      SECRET_EXPIRES: ${SECRET_EXPIRES}
      REFRESH_SECRET: ${REFRESH_SECRET}
      REFRESH_SECRET_EXPIRES: ${REFRESH_SECRET_EXPIRES}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: postgres_flowdesk
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowdesk_redis
    ports:
      - '6379:6379'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
